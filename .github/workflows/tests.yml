name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          extensions: pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest

      - name: Notify Telegram - Tests Failed
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf "TESTS FAILED - Deploy Dibatalkan!\n\nRepo: %s\nBranch: %s\nBy: %s\n\nDetail: %s" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.actor }}" "${RUN_URL}")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    environment: Testing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger aaPanel Webhook Deployment
        id: webhook
        run: |
          RESPONSE=$(curl -k -s -w "\n%{http_code}" -X POST "${{ secrets.AAPANEL_WEBHOOK_URL }}" --max-time 60)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "response=$BODY" >> $GITHUB_OUTPUT
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "Deploy triggered at $(date) | HTTP $HTTP_CODE | $BODY"

          # curl -s hanya gagal saat TIDAK BISA konek. Kalau webhook menjawab 4xx/5xx
          # (mis. token salah, script deploy error), curl tetap exit 0 dan step ini
          # dianggap sukses — notifikasinya lalu mengabarkan "DEPLOY BERHASIL"
          # padahal server menolak. Status HTTP-nya harus ikut diperiksa.
          case "$HTTP_CODE" in
            2*) ;;
            *)  echo "::error::Webhook deploy menjawab HTTP $HTTP_CODE — deploy dianggap GAGAL."
                exit 1 ;;
          esac

      - name: Notify Telegram - Deploy Status
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # job.status, bukan teks statis — dulu selalu kirim "BERHASIL" walau webhook gagal.
          if [ "${{ job.status }}" = "success" ]; then
            HEAD="DEPLOY BERHASIL!"
            FOOT="Aplikasi sudah live di server!"
          else
            HEAD="DEPLOY GAGAL!"
            FOOT="Cek log GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          TEXT=$(printf "%s\n\nRepo: %s\nBranch: %s\nBy: %s\n\n%s" \
            "$HEAD" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.actor }}" "$FOOT")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
