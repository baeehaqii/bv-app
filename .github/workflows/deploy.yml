name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger aaPanel Webhook Deployment
        run: |
          curl -k -X POST "${{ secrets.AAPANEL_WEBHOOK_URL }}" \
            --max-time 60 \
            --fail \
            --silent \
            --show-error
          echo "Deployment triggered at $(date)"
